# Fly.io — استقرار fx-macro API.  راه‌اندازی:
#   fly launch --no-deploy        (نام/منطقه را تأیید کن؛ از همین فایل می‌خواند)
#   fly secrets set FX_DB_DSN="..." ANTHROPIC_API_KEY="..." FINNHUB_API_KEY="..." \
#                   TELEGRAM_BOT_TOKEN="..." TELEGRAM_CHAT_ID="..."
#   fly deploy
app = "fx-macro"
primary_region = "fra"   # نزدیک‌ترین منطقه را بگذار (fra/ams/cdg/...)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0   # وقتی ترافیک نیست خاموش → ارزان

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
